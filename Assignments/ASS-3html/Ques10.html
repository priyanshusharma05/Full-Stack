<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>
<body>

<h1>Choose Your Travel Preferences</h1>

<form>
    <label for="country">Country:</label><br>
    <select id="country" name="country">
        <option value="usa" selected>USA</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
    </select>
    <br><br>

    <label for="state">State:</label><br>
    <select id="state" name="state">
        <option value="california" selected>California</option>
        <option value="texas">Texas</option>
        <option value="newyork">New York</option>
    </select>
    <br><br>

    <label for="city">City:</label><br>
    <select id="city" name="city">
        <option value="losangeles" selected>Los Angeles</option>
        <option value="sanfrancisco">San Francisco</option>
        <option value="sanantonio">San Antonio</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label><br>
    <select id="place" name="place">
        <option value="hollywood" selected>Hollywood</option>
        <option value="goldengate">Golden Gate Bridge</option>
        <option value="statueofliberty">Statue of Liberty</option>
    </select>
</form>

<p>
    Your current selections are: Country – USA, State – California, City – Los Angeles, Favorite Tourist Place – Hollywood.
</p>

</body>
</html>
