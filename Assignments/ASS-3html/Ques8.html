<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Student Report</title>
</head>
<body>

    <h1>Green Valley High School</h1>

                <th>Maximum Marks</th>
                <th>Grade</th>

        <tbody>
            <tr title="Mathematics">
                <td>Mathematics</td>
                <td>88</td>
                <td>100</td>
                <td>A</td>
            </tr>
            <tr title="Science">
                <td>Science</td>
                <td>82</td>
                <td>100</td>
                <td>A</td>
            </tr>
            <tr title="English">
                <td>English</td>
                <td>90</td>
                <td>100</td>
                <td>A+</td>
            </tr>
            <tr title="History">
                <td>History</td>
                <td>76</td>
                <td>100</td>
                <td>B+</td>
            </tr>
            <tr title="Geography">
                <td>Geography</td>
                <td>85</td>

                <td>A</td>
            </tr>

            <tr>
                <td colspan="2"><strong>Total</strong></td>
                <td>443 / 500</td>
                <td>88.6%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
